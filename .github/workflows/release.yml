name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed version tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@51dc7455067172c55b2161d71b36d3db2bb17c85
    with:
      ref: ${{ inputs.tag }}
  publish:
    needs: validate
    uses: swift-library/.github/.github/workflows/swift-package-release.yml@51dc7455067172c55b2161d71b36d3db2bb17c85
    with:
      tag: ${{ inputs.tag }}
      accepted_commit: ${{ needs.validate.outputs.commit }}
    permissions:
      contents: write
      actions: read
